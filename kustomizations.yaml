---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-directus
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/directus
  prune: true
  wait: true
  dependsOn:
    - name: external-secrets
    - name: infrastructure-postgres
    - name: infrastructure-minio
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
