apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: email
  namespace: website
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: email
    creationPolicy: Owner
  data:
    - secretKey: GMAIL_FROM
      remoteRef:
        key: email
        property: gmail_from
    - secretKey: GMAIL_APP_PASSWORD
      remoteRef:
        key: email
        property: gmail_app_password
    - secretKey: SYNC_WEBHOOK_SECRET
      remoteRef:
        key: email
        property: sync_webhook_secret
    - secretKey: TEST_EMAIL_RECIPIENT
      remoteRef:
        key: email
        property: test_email_recipient
