apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: obs-victoriametrics
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/observability/victoriametrics
  prune: true
  wait: true
  dependsOn:
    - name: obs-victoriametrics-operator
    - name: obs-exporters
    - name: infra-secret-store
