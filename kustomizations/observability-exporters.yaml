apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-exporters
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/observability/exporters
  prune: true
  wait: true
  dependsOn:
    - name: observability-vm-operator
    - name: external-secrets
