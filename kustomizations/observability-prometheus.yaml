apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-prometheus
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/observability/prometheus/stack
  prune: true
  wait: true
  dependsOn:
    - name: observability-prometheus-operator
    - name: secrets-store
