apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: traefik
      version: "39.*"
      sourceRef:
        kind: HelmRepository
        name: traefik
  values:
    ports:
      web:
        hostPort: 80
        redirections:
          entryPoint:
            to: websecure
            scheme: https
      websecure:
        hostPort: 443
    service:
      type: ClusterIP
