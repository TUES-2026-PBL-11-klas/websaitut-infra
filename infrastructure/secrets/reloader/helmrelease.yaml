apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: reloader-system
spec:
  interval: 1h
  chart:
    spec:
      chart: reloader
      version: "1.3.0"
      sourceRef:
        kind: HelmRepository
        name: stakater
      interval: 1h
  values:
    reloader:
      watchGlobally: true
      logFormat: json
