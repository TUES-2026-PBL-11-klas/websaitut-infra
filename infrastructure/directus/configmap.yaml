apiVersion: v1
kind: ConfigMap
metadata:
  name: directus-config
  namespace: directus
data:
  PUBLIC_URL: "https://cms.vdemirev.com"
  DB_CLIENT: "pg"
  DB_HOST: "postgres.postgres.svc.cluster.local"
  DB_PORT: "5432"
  DB_DATABASE: "directus"
  DB_USER: "directus"
  STORAGE_LOCATIONS: "s3"
  STORAGE_S3_DRIVER: "s3"
  STORAGE_S3_BUCKET: "directus"
  STORAGE_S3_REGION: "us-east-1"
  STORAGE_S3_ENDPOINT: "http://minio.minio.svc.cluster.local:9000"
  STORAGE_S3_FORCE_PATH_STYLE: "true"
