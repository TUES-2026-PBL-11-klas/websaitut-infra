apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: vm
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush            5
        Daemon           Off
        Log_Level        warn
        Parsers_File     /fluent-bit/etc/parsers.conf
        HTTP_Server      On
        HTTP_Listen      0.0.0.0
        HTTP_Port        2020

    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        # Skip Fluent Bit's own logs to avoid feedback loops
        Exclude_Path      /var/log/containers/fluent-bit*.log
        multiline.parser  docker, cri
        Refresh_Interval  5
        Mem_Buf_Limit     10MB
        Skip_Long_Lines   On
        DB                /var/log/flb-kube.db

    # Enrich with Kubernetes metadata. Merge_Log parses the `log` field as
    # JSON when the app emits structured logs (e.g. Flux controllers).
    # The `kubernetes` object stays nested — VictoriaLogs and the official
    # dashboards address it via dotted paths (kubernetes.pod_name, etc).
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Merge_Log_Key       log
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
        Annotations         Off
        Labels              On
        Buffer_Size         0

    # Populate the `stream` field VictoriaLogs uses as the primary stream key.
    # CRI parser already provides it (stdout/stderr); docker parser does not,
    # so we fall back to the tag component. Harmless if the field already exists.
    [FILTER]
        Name      modify
        Match     kube.*
        Add       stream stdout

    # Native VictoriaLogs jsonline ingestion. Stream fields mirror the official
    # VictoriaMetrics helm chart's Vector config exactly — this is what the
    # community VictoriaLogs Explorer dashboard (grafana.com/dashboards/22759)
    # addresses by default.
    [OUTPUT]
        Name              http
        Match             kube.*
        Host              victorialogs.vm.svc.cluster.local
        Port              9428
        URI               /insert/jsonline?_stream_fields=stream,kubernetes.pod_name,kubernetes.container_name,kubernetes.namespace_name&_msg_field=log,message,msg&_time_field=date
        Format            json_lines
        Json_date_format  iso8601
        Json_date_key     date
        Compress          gzip
        Retry_Limit       5
