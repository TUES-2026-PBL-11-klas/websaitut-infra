# NOTE: For this ServiceMonitor to work, Traefik must expose its metrics port.
# The Traefik HelmRelease (infrastructure/ingress/traefik/helmrelease.yaml)
# needs the `metrics.prometheus.enabled: true` value added. See OBSERVABILITY.md
# Day 1, Step 2 — traefik values patch.
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: traefik
  namespace: kube-system
  labels:
    app.kubernetes.io/name: traefik
spec:
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
