# Flux controllers expose Prometheus metrics on port 8080 automatically.
# These ServiceMonitors scrape all four controllers, giving us:
#   - gotk_reconcile_duration_seconds  (reconciliation latency histogram)
#   - gotk_reconcile_condition  (Ready/Stalled/Reconciling per resource)
#   - gotk_suspend_status  (which resources are suspended)
#   - controller_runtime_* (Go runtime metrics, leader election, etc.)
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: flux-system
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: flux
spec:
  namespaceSelector:
    matchNames:
      - flux-system
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - source-controller
          - kustomize-controller
          - helm-controller
          - notification-controller
          - image-reflector-controller
          - image-automation-controller
  endpoints:
    - port: http-prom
      interval: 60s
