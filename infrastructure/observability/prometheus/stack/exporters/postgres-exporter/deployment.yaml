apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-exporter-credentials
  namespace: prometheus
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: postgres-exporter-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        DATA_SOURCE_NAME: "postgresql://{{ .user }}:{{ .password }}@postgres.postgres.svc.cluster.local:5432/{{ .database }}?sslmode=disable"
  data:
    - secretKey: user
      remoteRef:
        key: postgres
        property: user
    - secretKey: password
      remoteRef:
        key: postgres
        property: password
    - secretKey: database
      remoteRef:
        key: postgres
        property: database
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: prometheus
  labels:
    app.kubernetes.io/name: postgres-exporter
  annotations:
    secret.reloader.stakater.com/reload: "postgres-exporter-credentials"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-exporter
    spec:
      containers:
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.18.1
          ports:
            - name: metrics
              containerPort: 9187
          env:
            - name: DATA_SOURCE_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-exporter-credentials
                  key: DATA_SOURCE_NAME
          livenessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: prometheus
  labels:
    app.kubernetes.io/name: postgres-exporter
spec:
  selector:
    app.kubernetes.io/name: postgres-exporter
  ports:
    - name: metrics
      port: 9187
      targetPort: 9187
