# We use two charts:
#  1. prometheus-operator-crds — ships just the CRDs (Prometheus, ServiceMonitor,
#     PrometheusRule, Alertmanager, etc.) without any operator binary.
#  2. kube-prometheus-stack — the umbrella chart. We enable ONLY the operator
#     itself and disable every bundled component. This is intentional: there's
#     no standalone "prometheus-operator" chart in the community repo anymore.
#     All actual components (Prometheus, exporters, ServiceMonitors, alerts,
#     Grafana, Loki) are declared as plain manifests in sibling folders, to
#     keep the stack transparent and defendable.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-operator-crds
  namespace: prometheus
spec:
  interval: 1h
  chart:
    spec:
      chart: prometheus-operator-crds
      version: "23.0.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: prometheus
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-operator
  namespace: prometheus
spec:
  interval: 1h
  dependsOn:
    - name: prometheus-operator-crds
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "77.5.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: prometheus
  values:
    crds:
      enabled: false
    defaultRules:
      create: false
    alertmanager:
      enabled: false
    grafana:
      enabled: false
    kubeApiServer:
      enabled: false
    kubelet:
      enabled: false
    kubeControllerManager:
      enabled: false
    coreDns:
      enabled: false
    kubeDns:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeStateMetrics:
      enabled: false
    nodeExporter:
      enabled: false
    prometheus:
      enabled: false
    thanosRuler:
      enabled: false
    prometheusOperator:
      enabled: true
      admissionWebhooks:
        enabled: true
        patch:
          enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 100Mi
        limits:
          cpu: 200m
          memory: 256Mi
    cleanPrometheusOperatorObjectNames: true
