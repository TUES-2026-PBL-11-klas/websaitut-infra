apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord-relay
  namespace: vm
  labels:
    app.kubernetes.io/name: discord-relay
  annotations:
    configmap.reloader.stakater.com/reload: "discord-relay-script"
    secret.reloader.stakater.com/reload: "discord-webhook"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: discord-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: discord-relay
    spec:
      containers:
        - name: relay
          image: python:3.12-alpine
          command: ["python", "-u", "/app/relay.py"]
          env:
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: discord-webhook
                  key: url
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: script
              mountPath: /app
      volumes:
        - name: script
          configMap:
            name: discord-relay-script
