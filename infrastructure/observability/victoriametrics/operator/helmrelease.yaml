apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vm-operator
  namespace: vm
spec:
  interval: 10m
  chart:
    spec:
      chart: victoria-metrics-operator
      # Pin to a known-good minor; bump manually after testing.
      # Check: helm search repo victoriametrics/victoria-metrics-operator
      version: "~0.37.0"
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    operator:
      # Do NOT auto-convert Prometheus CRDs — pure VM stack only.
      disable_prometheus_converter: true
