apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: observability-alerts
  namespace: vm
spec:
  groups:
    - name: node
      interval: 30s
      rules:
        - alert: NodeHighCPU
          expr: |
            100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Node CPU above 85% for 10 minutes"
            description: "{{ $labels.instance }} CPU usage: {{ $value | printf \"%.1f\" }}%"

        - alert: NodeHighMemory
          expr: |
            (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Node memory above 90% for 5 minutes"
            description: "{{ $labels.instance }} memory usage: {{ $value | printf \"%.1f\" }}%"

        - alert: NodeDiskHigh
          expr: |
            100 - (node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs|squashfs|overlay"}
                   / node_filesystem_size_bytes{fstype!~"tmpfs|fuse.lxcfs|squashfs|overlay"} * 100) > 85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Filesystem above 85% full"
            description: "{{ $labels.instance }} {{ $labels.mountpoint }}: {{ $value | printf \"%.1f\" }}% used"

    - name: workloads
      interval: 30s
      rules:
        - alert: PodCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total[10m]) > 2
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash-looping"
            description: "{{ $value }} restarts in the last 5 minutes"

        - alert: PodNotReady
          expr: |
            sum by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown|Failed"}) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} not ready"
            description: "Pod has been in a non-ready phase for over 5 minutes"

        - alert: PVCAlmostFull
          expr: |
            (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100 > 90
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} almost full"
            description: "{{ $value | printf \"%.1f\" }}% used"

    - name: cert-manager
      interval: 60s
      rules:
        - alert: CertificateNotReady
          expr: |
            certmanager_certificate_ready_status{condition="True"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} not ready"
            description: "cert-manager cannot issue or renew this certificate"

        - alert: CertificateRenewalFailed
          expr: |
            increase(certmanager_certificate_renewal_errors_total[1h]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Certificate renewal failed for {{ $labels.namespace }}/{{ $labels.name }}"
            description: "See cert-manager logs for the underlying challenge error"

    - name: flux
      interval: 30s
      rules:
        - alert: FluxKustomizationNotReady
          expr: |
            gotk_reconcile_condition{type="Ready", status="False", kind="Kustomization"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Kustomization {{ $labels.namespace }}/{{ $labels.name }} not ready"
            description: "Reconciliation has been failing for over 10 minutes"

        - alert: FluxHelmReleaseNotReady
          expr: |
            gotk_reconcile_condition{type="Ready", status="False", kind="HelmRelease"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "HelmRelease {{ $labels.namespace }}/{{ $labels.name }} not ready"
            description: "Helm reconciliation has been failing for over 10 minutes"

        - alert: FluxGitRepositoryFetchFailed
          expr: |
            gotk_reconcile_condition{type="Ready", status="False", kind="GitRepository"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "GitRepository {{ $labels.namespace }}/{{ $labels.name }} fetch failed"
            description: "Flux cannot fetch from git — check credentials or network"

        - alert: FluxImageRepositoryScanFailed
          expr: |
            gotk_reconcile_condition{type="Ready", status="False", kind="ImageRepository"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "ImageRepository {{ $labels.namespace }}/{{ $labels.name }} scan failed"
            description: "Flux cannot scan the container registry"

        - alert: FluxReconciliationSlow
          expr: |
            histogram_quantile(0.95,
              sum by (kind, le) (rate(gotk_reconcile_duration_seconds_bucket[15m]))
            ) > 60
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Flux {{ $labels.kind }} reconciliations are slow"
            description: "p95 reconciliation duration is above 60 seconds — something is blocking the control loop"

        - alert: FluxControllerRestarting
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="flux-system"}[10m]) > 3
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Flux controller {{ $labels.pod }} is restarting"
            description: "More than 3 restarts in 10 minutes"

        - alert: FluxResourcesSuspended
          expr: |
            sum(gotk_suspend_status == 1) > 0
          for: 1h
          labels:
            severity: info
          annotations:
            summary: "Flux resources are suspended"
            description: "{{ $value }} resources are currently suspended — did someone forget to resume them?"

    - name: external
      interval: 60s
      rules:
        - alert: ExternalEndpointDown
          expr: |
            probe_success == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "External endpoint {{ $labels.instance }} is down"
            description: "blackbox probe has been failing for 5 minutes"

        - alert: ExternalEndpointSlow
          expr: |
            avg_over_time(probe_duration_seconds[10m]) > 2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "External endpoint {{ $labels.instance }} is slow"
            description: "Average probe duration {{ $value | printf \"%.2f\" }}s over the last 10 minutes"

        - alert: TLSCertExpiringSoon
          expr: |
            (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "TLS cert for {{ $labels.instance }} expires in < 14 days"
            description: "{{ $value | printf \"%.1f\" }} days remaining — cert-manager may not have renewed"

    - name: database
      interval: 30s
      rules:
        - alert: PostgresDown
          expr: |
            pg_up == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "PostgreSQL is not reachable"
            description: "postgres-exporter cannot connect to the database"

        - alert: PostgresHighConnections
          expr: |
            sum by (instance) (pg_stat_activity_count)
              / on (instance) pg_settings_max_connections > 0.8
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "PostgreSQL connection pool above 80%"
            description: "{{ $value | printf \"%.0f\" }}% of max_connections in use"
