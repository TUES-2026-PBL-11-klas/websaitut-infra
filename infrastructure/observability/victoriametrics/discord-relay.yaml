---
apiVersion: v1
kind: ConfigMap
metadata:
  name: discord-relay-script
  namespace: vm
data:
  relay.py: |
    #!/usr/bin/env python3
    import json
    import os
    import urllib.request
    from http.server import BaseHTTPRequestHandler, HTTPServer

    DISCORD_URL = os.environ["DISCORD_WEBHOOK_URL"]
    COLORS = {"critical": 15158332, "warning": 16776960, "info": 3447003}

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            n = int(self.headers.get("Content-Length", 0))
            data = json.loads(self.rfile.read(n))
            alerts = data if isinstance(data, list) else data.get("alerts", [])
            embeds = []
            for a in alerts:
                labels = a.get("labels", {})
                anns = a.get("annotations", {})
                embeds.append({
                    "title": anns.get("summary", labels.get("alertname", "Alert")),
                    "description": anns.get("description", ""),
                    "color": COLORS.get(labels.get("severity", "info"), 3447003),
                })
            if embeds:
                payload = json.dumps({"embeds": embeds[:10]}).encode()
                req = urllib.request.Request(
                    DISCORD_URL, data=payload,
                    headers={"Content-Type": "application/json"}, method="POST"
                )
                urllib.request.urlopen(req, timeout=10)
            self.send_response(200)
            self.end_headers()

        def log_message(self, *args):
            pass

    HTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord-relay
  namespace: vm
  labels:
    app.kubernetes.io/name: discord-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: discord-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: discord-relay
    spec:
      containers:
        - name: relay
          image: python:3.12-alpine
          command: ["python", "/app/relay.py"]
          env:
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: discord-webhook
                  key: url
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: script
              mountPath: /app
      volumes:
        - name: script
          configMap:
            name: discord-relay-script
---
apiVersion: v1
kind: Service
metadata:
  name: discord-relay
  namespace: vm
  labels:
    app.kubernetes.io/name: discord-relay
spec:
  selector:
    app.kubernetes.io/name: discord-relay
  ports:
    - name: http
      port: 8080
      targetPort: 8080
