# This config tells Grafana to scan /etc/grafana/dashboards/ for dashboard
# JSON files and load them on startup. Each dashboard ConfigMap (one per
# file in dashboards/) will be mounted into that directory.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: grafana
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: true
        editable: false
        updateIntervalSeconds: 30
        allowUiUpdates: false
        options:
          path: /etc/grafana/dashboards
          foldersFromFilesStructure: true
