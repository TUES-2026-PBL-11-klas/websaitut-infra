apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grafana
  namespace: grafana
  labels:
    app.kubernetes.io/name: grafana
  annotations:
    # Reload on any provisioning change
    configmap.reloader.stakater.com/reload: "grafana-datasources,grafana-dashboards-config,grafana-alerting"
    secret.reloader.stakater.com/reload: "grafana-credentials"
spec:
  serviceName: grafana
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      initContainers:
        # Grafana needs the provisioning dirs writable to link dashboard files.
        # We merge ConfigMap mounts (read-only) into a writable emptyDir here.
        - name: init-dashboards
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              mkdir -p /dashboards-out
              cp -L /dashboards-in/*.json /dashboards-out/ 2>/dev/null || true
              ls -la /dashboards-out
          volumeMounts:
            - name: dashboards-in
              mountPath: /dashboards-in
            - name: dashboards-out
              mountPath: /dashboards-out
      containers:
        - name: grafana
          image: grafana/grafana:12.2.1
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-credentials
                  key: admin_password
            - name: GF_DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: grafana-credentials
                  key: discord_webhook_url
            - name: GF_SERVER_ROOT_URL
              value: https://grafana.vdemirev.com
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            # Disable user signup; admin creates users manually via UI
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_USERS_ALLOW_ORG_CREATE
              value: "false"
            # Let Grafana expand env vars inside provisioning YAML
            - name: GF_FEATURE_TOGGLES_ENABLE
              value: "provisioning"
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: alerting
              mountPath: /etc/grafana/provisioning/alerting
            - name: dashboards-out
              mountPath: /etc/grafana/dashboards
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-config
        - name: alerting
          configMap:
            name: grafana-alerting
        - name: dashboards-in
          projected:
            sources:
              - configMap:
                  name: grafana-dashboard-k8s-cluster
              - configMap:
                  name: grafana-dashboard-node-exporter
              - configMap:
                  name: grafana-dashboard-flux
              - configMap:
                  name: grafana-dashboard-traefik
              - configMap:
                  name: grafana-dashboard-postgres
              - configMap:
                  name: grafana-dashboard-blackbox
              - configMap:
                  name: grafana-dashboard-logs
        - name: dashboards-out
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
