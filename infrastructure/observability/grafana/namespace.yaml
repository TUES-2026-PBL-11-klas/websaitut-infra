apiVersion: v1
kind: Namespace
metadata:
  name: grafana
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: grafana
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 50m
        memory: 128Mi
