apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting
  namespace: grafana
data:
  contactpoints.yaml: |
    apiVersion: 1
    contactPoints:
      - orgId: 1
        name: discord
        receivers:
          - uid: discord-primary
            type: discord
            settings:
              url: ${GF_DISCORD_WEBHOOK_URL}
              use_discord_username: false
              avatar_url: ""
              title: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"
              message: |
                {{ range .Alerts }}
                **{{ .Labels.severity | toUpper }}** — {{ .Annotations.summary }}
                {{ .Annotations.description }}
                {{ end }}
  policies.yaml: |
    apiVersion: 1
    # Empty — Grafana uses its default policy tree
