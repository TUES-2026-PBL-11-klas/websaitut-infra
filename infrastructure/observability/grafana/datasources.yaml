# Grafana reads this ConfigMap on startup and auto-configures the datasources.
# No manual clicking in the UI required. Passwords/tokens would be referenced
# as env vars, but both our datasources are internal cluster services with no
# auth, so plain URLs suffice.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    deleteDatasources:
      - name: Prometheus
        orgId: 1
      - name: Loki
        orgId: 1
    datasources:
      - name: VictoriaMetrics
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://vmsingle-victoria-metrics.vm.svc.cluster.local:8429
        isDefault: true
        editable: false
        jsonData:
          timeInterval: "30s"
          manageAlerts: false
      - name: VictoriaLogs
        uid: victorialogs
        type: victoriametrics-logs-datasource
        access: proxy
        url: http://victorialogs.vm.svc.cluster.local:9428
        editable: false
        jsonData:
          maxLines: 1000
