apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-victorialogs-simple
  namespace: grafana
  labels:
    grafana_dashboard: "1"
data:
  victorialogs-simple.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 23,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false,
            "showCommonLabels": false,
            "showLabels": false,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": false
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(kubernetes_namespace: ${namespace.*} AND kubernetes_pod_name: ${workload.*}) OR \"${query.*}\"",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "title": "Logs in ${namespace} for ${workload}",
          "type": "logs"
        }
      ],
      "schemaVersion": 39,
      "tags": [],
      "templating": {
        "list": [
          {
            "description": "Datasource for logs",
            "label": "Logs Datasource",
            "name": "DS_LOGS",
            "type": "constant",
            "hide": 2,
            "skipUrlSync": false
          },
          {
            "description": "Datasource for metrics",
            "label": "Metrics Datasource",
            "name": "DS_METRICS",
            "type": "constant",
            "hide": 2,
            "skipUrlSync": false
          },
          {
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "definition": "label_values(kube_namespace_created,namespace)",
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "name": "namespace",
            "options": [],
            "query": {
              "qryType": 1,
              "query": "label_values(kube_namespace_created,namespace)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "sort": 0,
            "type": "query"
          },
          {
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "definition": "label_values(namespace_workload_pod:kube_pod_owner:relabel{namespace=\"$namespace\"},workload)",
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "name": "workload",
            "options": [],
            "query": {
              "qryType": 1,
              "query": "label_values(namespace_workload_pod:kube_pod_owner:relabel{namespace=\"$namespace\"},workload)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "sort": 0,
            "type": "query"
          },
          {
            "current": {
              "selected": false,
              "text": "",
              "value": ""
            },
            "hide": 0,
            "name": "query",
            "options": [
              {
                "selected": true,
                "text": "",
                "value": ""
              }
            ],
            "query": "",
            "skipUrlSync": false,
            "type": "textbox"
          }
        ]
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "title": "Simple VictoriaLogs",
      "version": 1,
      "weekStart": "",
      "gnetId": 21550,
      "description": "Simple dashboard to watch VictoriaLogs\r\n"
    }
