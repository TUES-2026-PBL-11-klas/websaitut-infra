apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail
  namespace: logging
data:
  promtail.yaml: |
    # Promtail tails /var/log/pods/ on each node, enriches log lines with
    # Kubernetes metadata (namespace, pod, container), and forwards to Loki.
    server:
      http_listen_port: 3101
      grpc_listen_port: 0
      log_level: info

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://loki.logging.svc.cluster.local:3100/loki/api/v1/push
        # Batch to reduce request load on Loki
        batchwait: 1s
        batchsize: 1048576

    scrape_configs:
      - job_name: kubernetes-pods
        pipeline_stages:
          - cri: {}
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # Keep only pods on this node (Promtail runs per-node)
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: __host__
          # Namespace as a Loki label
          - action: replace
            source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          # Pod name as a Loki label
          - action: replace
            source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          # Container name as a Loki label
          - action: replace
            source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          # Point the file tail at the right on-disk log location.
          # k3s stores them in /var/log/pods/<namespace>_<pod>_<uid>/<container>/*.log
          - action: replace
            replacement: /var/log/pods/*$1/*.log
            separator: /
            source_labels:
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_pod_container_name
            target_label: __path__
