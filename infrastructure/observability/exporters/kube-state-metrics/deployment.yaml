apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: vm
  labels:
    app.kubernetes.io/name: kube-state-metrics
  annotations:
    configmap.reloader.stakater.com/reload: "kube-state-metrics-flux-config"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.18.0
          args:
            - --custom-resource-state-config-file=/etc/ksm/custom-resource-state.yaml
            - --custom-resource-state-only=false
          ports:
            - name: metrics
              containerPort: 8080
            - name: telemetry
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /livez
              port: metrics
            initialDelaySeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: telemetry
            initialDelaySeconds: 5
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
          volumeMounts:
            - name: custom-resource-config
              mountPath: /etc/ksm
              readOnly: true
      volumes:
        - name: custom-resource-config
          configMap:
            name: kube-state-metrics-flux-config
