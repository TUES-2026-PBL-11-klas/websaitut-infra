apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-config
  namespace: vm
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: discord
      group_by: ['alertname', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h

    receivers:
      - name: discord
        discord_configs:
          - webhook_url_file: /etc/vm/secrets/alertmanager-webhook/discord-webhook-url
            title: '{{ if eq .Status "firing" }}🔥 [FIRING:{{ .Alerts.Firing | len }}]{{ else }}✅ [RESOLVED]{{ end }} {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
            message: |-
              {{ range .Alerts -}}
              **{{ .Annotations.summary }}**
              {{ with .Annotations.description }}{{ . }}
              {{ end }}
              {{ end -}}

    inhibit_rules:
      - source_matchers: ['severity = "critical"']
        target_matchers: ['severity = "warning"']
        equal: ['alertname', 'instance']
