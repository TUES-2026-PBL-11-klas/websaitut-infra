apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alertmanager
  namespace: vm
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: vm-alertmanager-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: alertmanager.vdemirev.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vmalertmanager-main
                port:
                  number: 9093
  tls:
    - hosts: [alertmanager.vdemirev.com]
      secretName: alertmanager-tls
